# Setup
title: 'Пропущенный семестр'
url: https://missing-semester-rus.github.io
thumbnail: "/static/assets/thumbnails/default.png"

# Settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
highlighter: rouge
permalink: /:title/
future: true
# safe: true # breaks local rendering if enabled
timezone: America/New_York
analytics:
  tracking_id: ''  # set to your own GA4 measurement id to enable analytics

collections:
  '2019':
    output: true
  '2020':
    output: true
  '2026':
    output: true

# Excludes
exclude:
  - AGENTS.md
  - CNAME
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - README.md
  - browser.sh
  - docker-compose.yml
  - vendor
